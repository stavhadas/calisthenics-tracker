name: Deploy to GCE

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/calisthenics-tracker:${{ github.ref_name }}"
          LATEST="gcr.io/${{ secrets.GCP_PROJECT_ID }}/calisthenics-tracker:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy to GCE instance
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.GCE_INSTANCE_NAME }}
          zone: ${{ secrets.GCE_ZONE }}
          ssh_private_key: ${{ secrets.GCE_SSH_KEY }}
          command: |
            IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/calisthenics-tracker:${{ github.ref_name }}"
            gcloud auth configure-docker --quiet
            docker pull "$IMAGE"
            docker stop calisthenics-tracker 2>/dev/null || true
            docker rm calisthenics-tracker 2>/dev/null || true
            mkdir -p /opt/calisthenics/data
            docker run -d \
              --name calisthenics-tracker \
              --restart unless-stopped \
              -p 80:3000 \
              -v /opt/calisthenics/data:/data \
              -e ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
              -e DB_PATH=/data/db.sqlite \
              -e NODE_ENV=production \
              "$IMAGE"
            docker image prune -f
